<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <!-- iOS Safari otherwise turns radio text such as "HANG TIME 91 / 91.5" into underlined phone/address links -->
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
  <title>Dunk Lab</title>
  <meta name="description" content="Dunk Lab: pick a takeoff and a dunk, watch it as line art, with a retro car radio.">
  <meta name="theme-color" content="#0C0E11">
  <link rel="icon" href="assets/brand/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/icon_32.png">
  <link rel="apple-touch-icon" href="assets/brand/icon_180.png">
  <link rel="manifest" href="site.webmanifest">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Dunk Lab">
  <meta property="og:title" content="Dunk Lab">
  <meta property="og:description" content="Pick a takeoff and a dunk, then watch it as line art redrawn live on the GPU.">
  <meta property="og:url" content="https://dunklab.app/">
  <meta property="og:image" content="https://dunklab.app/assets/brand/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="The Dunk Lab logo in champagne gold on a dark court">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Dunk Lab">
  <meta name="twitter:description" content="Pick a takeoff and a dunk, then watch it as line art redrawn live on the GPU.">
  <meta name="twitter:image" content="https://dunklab.app/assets/brand/og.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto:wght@700&family=Saira:ital,wdth,wght@0,125,500;0,125,600;1,125,600;1,125,700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="assets/brand/logo_metal.png">
  <link rel="stylesheet" href="css/style.css?v=36">
  <!-- Live WebGL2 court behind the page (js/court.js). Decided before CSS paints, so browsers that will render it
       don't download the static background.jpg; main.js removes the class again if the court can't start. -->
  <script>if (window.WebGL2RenderingContext && !/[?&]court=off(&|$)/.test(location.search)) document.documentElement.classList.add("court");</script>
</head>
<body>
  <canvas id="court" aria-hidden="true"></canvas>
  <canvas id="cutout" aria-hidden="true"></canvas>
  <main id="app">
    <section id="menu">
      <header class="title">
        <h1 class="logo"><img src="assets/brand/logo_metal.png" width="1202" height="147" alt="Dunk Lab"><i class="sweep" aria-hidden="true"></i></h1>
        <div class="divider"></div>
        <p id="subtitle"></p>
      </header>
      <div id="takeoffs" class="list"></div>
      <div id="dunks" class="list" hidden></div>
    </section>

    <section id="player" hidden>
      <p id="caption"></p>
      <div class="stage">
        <p id="slide-hint" hidden>Use the slider to<br>view the original &rsaquo;</p>
        <div id="frame">
          <div class="screen">
            <video id="video" muted loop playsinline autoplay preload="auto"></video>
            <canvas id="fx" hidden></canvas>
            <video id="real" muted loop playsinline preload="auto" aria-label="Real footage"></video>
            <div id="split" hidden role="slider" aria-label="Compare with the real footage"><i></i></div>
          </div>
          <div class="bezel"></div>
          <button type="button" id="sfx-toggle" aria-label="Sound effects" aria-pressed="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path class="spk" d="M3 9.5h4l5-4v13l-5-4H3z"/><path class="waves" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="cross" d="M15.5 9.5l5 5M20.5 9.5l-5 5"/></svg>
          </button>
          <button type="button" id="view-close" aria-label="Back to ON COURT" title="Back to ON COURT" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg>
          </button>
          <p id="status" hidden></p>
        </div>
        <aside id="explain" aria-live="polite">
          <b id="explain-title"></b>
          <span id="explain-text"></span>
          <em id="explain-note" hidden></em>
        </aside>
      </div>
      <div class="controls">
        <button type="button" id="details-hint">DETAILS BELOW <i></i></button>
        <button type="button" class="key" id="key-view"><i class="icon i-view"></i><span id="view-label">VIEW: LINE ART</span></button>
        <button type="button" class="key" id="key-slow"><i class="icon i-slow"></i><span class="long">SLOW-MO: </span><span class="short">SLOW </span><span id="slow-state">OFF</span></button>
        <button type="button" class="key" id="key-replay" aria-label="Replay"><i class="icon i-replay"></i>REPLAY</button>
        <button type="button" class="key" id="key-pause" aria-label="Pause or play"><i class="icon i-pause"></i><i class="icon i-play"></i><span class="l-pause">PAUSE</span><span class="l-play">PLAY</span></button>
        <button type="button" class="key" id="key-back"><i class="icon i-back"></i><span class="long">BACK TO MENU</span><span class="short">BACK</span></button>
      </div>
    </section>
  </main>

  <div id="radio-dock"></div>

  <script type="module" src="js/main.js?v=42"></script>
</body>
</html>
